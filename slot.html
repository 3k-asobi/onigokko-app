<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬼きめスロットマシン 🎰</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* スロット画面専用の調整 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0f171e;
        }
        .slot-page-container {
            text-align: center;
            background: rgba(26, 37, 47, 0.95);
            border: 4px solid #34495e;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 90%;
        }
        
        /* 👑 タイトルエリア：アイコンを消去し、目立つネオンレッドの下線を追加 */
        .slot-page-title {
            color: #ffffff;
            font-size: 1.7rem;
            margin-bottom: 25px;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
        }
        /* タイトル下の発光アンダーライン */
        .slot-page-title::after {
            content: "";
            position: absolute;
            left: 5%;
            bottom: 0;
            width: 90%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #ff3344, transparent);
            box-shadow: 0 0 8px #ff3344, 0 0 15px #ff3344;
            border-radius: 2px;
        }
        
        /* 📦 宝箱のコンテナを基準（Relative）にする */
        .treasure-chest-container {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 320px; 
            margin: 0 -15px; /* スロットを中央に寄せるための微調整 */
        }

        .chest-image-bg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 👹 宝箱の画像サイズに対して「％」で位置を決める */
        .slot-window-wrapper {
            position: absolute;
            top: 28%;       
            left: 50%;
            transform: translateX(-50%);
            
            width: 68%;       
            height: 44%;      
            
            overflow: hidden;
            z-index: 2;
        }

        /* 📺 スロット窓 */
        .slot-window {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            position: relative;
        }

        /* 🤍 回転中だけ中央に出現する「上下に黒線がついた白いリール帯」 */
        .slot-window::before {
            content: "";
            position: absolute;
            left: 0;
            width: 100%;
            height: 60%; /* 中央の60%だけを白くし、上下に黒画面を残す */
            top: 20%;
            background-color: #ffffff;
            border-top: 4px solid #000000;    /* 上の黒い区切り線 */
            border-bottom: 4px solid #000000; /* 下の黒い区切り線 */
            box-sizing: border-box;
            display: none; /* 通常時は完全非表示 */
            z-index: 1;
        }

        /* 🔄 回転中の縦揺れアニメーション */
        @keyframes reelMove {
            0% { transform: translateY(-6px); }
            100% { transform: translateY(6px); }
        }

        /* spinningクラスがついた時だけ、中央に白い帯を出し、区切り線と一緒に縦に揺らす */
        .slot-window.spinning::before {
            display: block;
            animation: reelMove 0.06s linear infinite alternate;
        }

        .slot-reel {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 3; /* 白い帯よりもさらに手前に確実に文字・画像を表示 */
        }

        /* 中のアイテムも窓の高さ（100%）に合わせる */
        .reel-item {
            height: 100% !important;
            min-height: 100% !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000 !important;
            border: none !important;
            flex-shrink: 0;
        }

        /* READYや結果用ラッパー */
        .slot-inner-container {
            display: flex !important;
            flex-direction: column !important; 
            align-items: center !important;
            justify-content: center !important;
            text-align: center;
            width: 100%;
        }

        /* 💡 キャラクター画像と名前を1つに包む白い図柄カード */
        .char-card {
            background-color: #ffffff;
            padding: 8px 16px; /* 上下左右にバランスの良い余白を確保 */
            border-radius: 10px; /* 綺麗な角丸カード風に */
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-width: 110px; /* 名前が短くてもカードの美しさを保つ最小幅 */
        }

        /* カード内の名前テキスト */
        .char-card-name {
            font-weight: bold;
            font-size: 1.05rem;
            margin-top: 5px; /* 画像と名前の間のわずかな自然な隙間 */
            line-height: 1.2;
        }

        /* 🔴 決定したオニの名前表示（赤を基調とした魔王風ネオンリザルト） */
        .oni-result-box {
            /* 
               💡【修正ポイント】
               フォントサイズを「cqi」や「vw」などの可変単位、または少しコンパクトな1rem（基準値）に抑え、
               画面幅に対して絶対に1行で綺麗にフィットする構造にしました。
            */
            font-size: 1.05rem; 
            font-weight: 900;
            color: #ffffff; 
            margin: 20px auto 10px auto;
            padding: 10px 22px; /* 左右の余白を適切にし、はみ出しを防ぐ */
            
            background: linear-gradient(145deg, #2c1114, #120507);
            border: 2px solid #ff3344;
            border-radius: 50px; 
            box-shadow: 0 0 15px rgba(255, 51, 68, 0.2);
            display: inline-flex;  /* 内部要素を中央に一列で並べる */
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            
            /* 1行制限＆見切れ防止策 */
            white-space: nowrap;          
            max-width: 95%;               
            box-sizing: border-box;       
            overflow: hidden;             
            
            letter-spacing: 0.05em;
        }

        /* スロットが止まって結果が表示されたときのスタイル */
        .oni-result-box.show {
            opacity: 1;
            transform: scale(1);
            text-shadow: 0 0 6px rgba(255, 51, 68, 0.4);
            box-shadow: 0 0 25px rgba(255, 51, 68, 0.6), inset 0 0 12px rgba(255, 51, 68, 0.3);
            border-color: #ff3344;
        }

        /* 🌟 赤背景の中で最も目立たせるための強烈なネオンイエローのキャラクター名 */
        .oni-result-name {
            color: #ffff00; 
            font-size: 1.2rem; /* 1.35remから少し調整し、文字サイズの段差を減らして横幅を圧縮 */
            padding: 0 4px; 
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 255, 0, 0.4);
            display: inline-block;
        }

        /* 🛠️ 画面幅が小さいスマホ向けのレスポンシブ微調整 */
        @media (max-width: 440px) {
            .oni-result-box {
                font-size: 0.95rem; /* スマホ画面では全体をわずかに縮小 */
                padding: 8px 16px;
            }
            .oni-result-name {
                font-size: 1.1rem;
            }
        }
        @media (max-width: 360px) {
            .oni-result-box {
                font-size: 0.85rem; /* 超小型スマホ（iPhone SEなど）でも確実に1行に入るサイズ */
                padding: 6px 12px;
            }
            .oni-result-name {
                font-size: 1rem;
            }
        }

        .btn-close {
            background: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="slot-page-container">
        <!-- 👑 両端のアイコンを取り除き、CSSでかっこいいネオン下線をプラス -->
        <h1 class="slot-page-title">鬼きめスロット</h1>
        <p style="color: #bdc3c7;">レバーを下に引っ張ってスロットを回そう！</p>

        <!-- スロット全体（宝箱＋レバー） -->
        <div class="slot-machine-wrapper" style="margin: 30px auto;">
            
            <!-- 🧰 宝箱コンテナ -->
            <div id="oni-slot-container" class="treasure-chest-container">
                <!-- images フォルダの中にある場合 -->
<!-- ⭕ 修正後: リポジトリ直下のファイルを直接指定 -->
<img src="chest-body.png" alt="宝箱" class="chest-image-bg">
                <div class="slot-window-wrapper">
                    <div id="slot-window" class="slot-window">
                        <div id="slot-reel" class="slot-reel">
                            <!-- 初期表示のREADY -->
                            <div id="slot-display-name" style="color: #7f8c8d; font-size: 1.1rem; font-weight: bold;">READY</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 🕹️ 立体レバーギミック -->
            <div class="lever-container">
                <div class="lever-base"></div>
                <div id="slot-lever" class="lever-shaft">
                    <div class="lever-ball"></div>
                </div>
            </div>

        </div>

        <!-- 決定したオニの名前表示（CSSで絶対1列＆赤ネオン制御） -->
        <div id="oni-result" class="oni-result-box"></div>

        <!-- 閉じるボタン -->
        <button type="button" class="btn-close" onclick="window.close()">✖ 画面を閉じる</button>
    </div>

    <!-- 画面フラッシュ用の要素 -->
    <div id="flash-screen" class="flash-effect"></div>

    <script>
        const players = JSON.parse(localStorage.getItem('registeredPlayers')) || [];
        const slotLever = document.getElementById('slot-lever');
        const slotWindow = document.getElementById('slot-window');
        const slotDisplayName = document.getElementById('slot-display-name');
        const oniResult = document.getElementById('oni-result');
        const flashScreen = document.getElementById('flash-screen');
        let isRolling = false;

        // 🎵 Web Audio API を使った即席SEジェネレーター
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // レバーを引いたときの「カチッ」音
        function playLeverSE() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // 回転中・切り替わり時の「ピピッ」音
        function playPiSE() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5の明るい高音
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime); // うるさすぎない音量
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // ファンファーレ（当たり決定）の「ピピピピピーン！」音
        function playWinSE() {
            initAudio();
            const now = audioCtx.currentTime;
            
            // ピピピと短い上り音の連続
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 のドミソド
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.08);
                
                // 最後の決定音（C6）だけ長めに響かせる
                const duration = index === notes.length - 1 ? 0.6 : 0.08;
                gain.gain.setValueAtTime(0.12, now + index * 0.08);
                gain.gain.linearRampToValueAtTime(0.001, now + index * 0.08 + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.08);
                osc.stop(now + index * 0.08 + duration);
            });
        }

        if (players.length === 0) {
            slotDisplayName.textContent = "メンバーなし";
            slotDisplayName.style.color = "#e74c3c";
        }

        slotLever.addEventListener('click', () => {
            if (isRolling || players.length === 0) return;
            isRolling = true;

            // 初回クリック時にオーディオコンテキストをアクティブにするためのトリガー
            initAudio();

            oniResult.classList.remove('show');

            // 🔊 レバーのSEを再生
            playLeverSE();

            // レバーを引くアニメーション
            slotLever.classList.add('pulled');
            setTimeout(() => slotLever.classList.remove('pulled'), 400);

            // ⚡【回転開始】窓にクラスをつけて中央に白い帯と黒の区切り線を出して揺らす
            slotWindow.classList.add('spinning');

            let count = 0;
            const maxCount = 40; // 切り替わる総回数
            let currentSpeed = 50; // 最初のスタートダッシュ速度（50ミリ秒＝超高速）

            // だんだん遅くしながら再帰的に呼び出す関数（ブレーキ機能）
            function shuffleShuffle() {
                const randomPlayer = players[Math.floor(Math.random() * players.length)];
                
                // 画像と名前を1つの「char-card」で包み込んで完全に一体化
                slotDisplayName.innerHTML = `
                    <div class="slot-inner-container">
                        <div class="char-card">
                            <img src="${randomPlayer.icon}" style="width:60px; height:60px; object-fit:contain; display:block;">
                            <div class="char-card-name" style="color:#000000 !important;">
                                ${randomPlayer.name}
                            </div>
                        </div>
                    </div>
                `;
                
                // ブラウザが画面に「描き終えた瞬間」を検知してSEを鳴らす（完全同期）
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        playPiSE();
                    });
                });

                count++;

                if (count < maxCount) {
                    if (count > 25) { 
                        currentSpeed += 20; 
                    }
                    if (count > 34) { 
                        currentSpeed += 50; 
                    }

                    setTimeout(shuffleShuffle, currentSpeed);
                } else {
                    // 🛑【回転停止】すべてのシャッフルが終わったら最終決定へ
                    const winner = players[Math.floor(Math.random() * players.length)];
                    
                    slotWindow.classList.remove('spinning');
                    
                    // 決定時も1つの白いカード。決定した名前は上品な濃い青色に。
                    slotDisplayName.innerHTML = `
                        <div class="slot-inner-container">
                            <div class="char-card">
                                <img src="${winner.icon}" style="width:60px; height:60px; object-fit:contain; display:block;">
                                <div class="char-card-name" style="color:#003366 !important; font-size:1.1rem;">
                                    ${winner.name}
                                </div>
                            </div>
                        </div>
                    `;
                    
                    // 🔊 最終決定時のファンファーレを再生！
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            playWinSE();
                        });
                    });

                    // 結果表示とエフェクト（名前の部分を「」で囲んでアピール）
                    oniResult.innerHTML = `鬼は 「<span class="oni-result-name">${winner.name}</span>」 に決まり！`;
                    oniResult.classList.add('show');
                    flashScreen.classList.add('active');
                    setTimeout(() => flashScreen.classList.remove('active'), 300);

                    localStorage.setItem('latestOniResult', winner.name);

                    isRolling = false;
                }
            }

            // レバーオンしてから少しだけ(100ms)待って最初の図柄切り替えを開始（レバー音との被りを防止）
            setTimeout(shuffleShuffle, 100);
        });
    </script>
</body>
</html>
